[project]
name = "incident-response"
version = "0.1.0"
description = "Receives Grafana alerts, saves their telemetry context, and starts a coding assistant"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "uvicorn>=0.30,<1",
]

[project.scripts]
incident-response = "incident_response.main:run"

[dependency-groups]
dev = [
  "pytest>=8,<10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
